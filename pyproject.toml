[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gamelokal"
version = "0.1.0"
description = "Toolkit lokalisasi game: ekspor teks, terjemahan mesin yang aman untuk tag, pengecekan kualitas, dan pembuatan patch."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
gamelokal = "gamelokal.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
gamelokal = ["web/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
